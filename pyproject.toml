[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "elowyn"
version = "0.1.0"
description = "Personal AI assistant core — v0.1 foundation"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.30,<4",
  "pydantic>=2.12,<3",
  "pydantic-ai>=2.27,<3",
  "python-dotenv>=1.0,<2",
  "SQLAlchemy>=2.0.52,<2.1",
  "alembic>=1.19,<2",
  "asyncpg>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
]
dev = [
  "ruff>=0.12",
  "mypy>=1.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/elowyn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "postgres: requires a PostgreSQL test database",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
